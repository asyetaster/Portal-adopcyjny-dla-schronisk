<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rejestracja</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center align-items-center min-vh-100 py-4">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 mb-1 text-center">
            <i class="bi bi-box-seam me-2"></i> Portal adopcyjny
          </h1>
          <p class="text-secondary text-center mb-4">Załóż konto</p>

          {% for flashed in get_flashed_messages() %}
            <div class="alert alert-info py-2" role="alert">{{ flashed }}</div>
          {% endfor %}

          <form method="post" action="{{ url_for('register_submit') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="row">
              <div class="col-sm-6 mb-3">
                <label for="first_name" class="form-label">Imię</label>
                <input type="text" id="first_name" name="first_name" class="form-control"
                       maxlength="100" autocomplete="given-name" required autofocus>
              </div>
              <div class="col-sm-6 mb-3">
                <label for="last_name" class="form-label">Nazwisko</label>
                <input type="text" id="last_name" name="last_name" class="form-control"
                       maxlength="100" autocomplete="family-name" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" id="email" name="email" class="form-control"
                     maxlength="254" autocomplete="email" required>
            </div>

            <div class="mb-3">
              <label for="phone" class="form-label">Telefon</label>
              <input type="tel" id="phone" name="phone" class="form-control" autocomplete="tel">
              <div class="form-text">Pole opcjonalne.</div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Hasło</label>
              <input type="password" id="password" name="password" class="form-control"
                     minlength="8" autocomplete="new-password" required>
              <div class="form-text">Co najmniej 8 znaków.</div>
            </div>

            <div class="mb-4">
              <label for="password_confirm" class="form-label">Powtórz hasło</label>
              <input type="password" id="password_confirm" name="password_confirm" class="form-control"
                     minlength="8" autocomplete="new-password" required>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-person-plus me-1"></i> Załóż konto
              </button>
            </div>
          </form>

          <p class="text-center mt-3 mb-0 small">
            Masz już konto? <a href="{{ url_for('login') }}">Zaloguj się</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
