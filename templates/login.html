<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logowanie</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center align-items-center min-vh-100 py-4">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 mb-1 text-center">
            <i class="bi bi-box-seam me-2"></i> Portal adopcyjny
          </h1>
          <p class="text-secondary text-center mb-4">Panel administracyjny — logowanie</p>

          {% for flashed in get_flashed_messages() %}
            <div class="alert alert-danger py-2" role="alert">{{ flashed }}</div>
          {% endfor %}

          <form method="post" action="{{ url_for('login_submit') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

            <div class="mb-3">
              <label for="email" class="form-label">E-mail</label>
              <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                autocomplete="username"
                required
                autofocus
              >
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">Hasło</label>
              <input
                type="password"
                id="password"
                name="password"
                class="form-control"
                autocomplete="current-password"
                required
              >
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-box-arrow-in-right me-1"></i> Zaloguj
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
