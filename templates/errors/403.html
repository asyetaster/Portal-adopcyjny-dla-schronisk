<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brak uprawnień</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
  <div class="row justify-content-center align-items-center min-vh-100 py-4">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body p-4 text-center">
          <i class="bi bi-shield-lock display-1 text-danger mb-3"></i>
          <h1 class="h4 mb-2">Brak uprawnień administratora</h1>
          <p class="text-secondary mb-4">
            Nie masz uprawnień do panelu administracyjnego.
          </p>
          <form method="post" action="{{ url_for('logout') }}" class="d-inline">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-outline-secondary">
              <i class="bi bi-box-arrow-right me-1"></i> Wyloguj się
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
