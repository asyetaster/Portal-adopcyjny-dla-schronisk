{% extends "panel/base.html" %}
{% block title %}Profil placówki{% endblock %}

{% block content %}
<h1 class="h4 mb-4">Profil placówki</h1>

<div class="card"><div class="card-body">
  <form method="post" action="{{ url_for('panel_shelter_update', shelter_id=shelter.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <fieldset {% if shelter.status == 'Blocked' %}disabled{% endif %}>
      {% include "shelters/_fields.html" %}
      <button type="submit" class="btn btn-primary">Zapisz</button>
    </fieldset>
  </form>
</div></div>
{% endblock %}
