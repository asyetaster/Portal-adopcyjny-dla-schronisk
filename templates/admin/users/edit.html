{% extends "admin/base.html" %}

{% block title %}
Edytuj: {{ user.first_name }} {{ user.last_name }}
{% endblock %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
  <div>
    <h1 class="h4 mb-1">Edytuj użytkownika</h1>
    <p class="text-secondary mb-0">
      {{ user.first_name }} {{ user.last_name }} · #{{ user.id }}
    </p>
  </div>

  <a
    href="{{ url_for('user_details', user_id=user.id) }}"
    class="btn btn-outline-secondary"
  >
    <i class="bi bi-arrow-left me-1"></i> Wróć
  </a>
</div>

<div class="card">
  <div class="card-body">
    <form
      method="post"
      action="{{ url_for('update_user', user_id=user.id) }}"
    >
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      {% include "admin/users/_form_fields.html" %}

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-lg me-1"></i> Zapisz zmiany
        </button>
        <a
          href="{{ url_for('user_details', user_id=user.id) }}"
          class="btn btn-outline-secondary"
        >
          Anuluj
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
