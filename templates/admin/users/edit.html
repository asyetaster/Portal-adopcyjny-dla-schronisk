{% extends "admin/base.html" %}
{% block title %}Edytuj: {{ user.name }}{% endblock %}
{% block content %}
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
          <h1 class="h4 mb-1">Edytuj użytkownika</h1>
          <p class="text-secondary mb-0">
            {{ user.name }} <span class="text-secondary">· #{{ user.id }}</span>
          </p>
        </div>
        <a href="{{ url_for('user_details', user_id=user.id) }}" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left me-1"></i> Wróć
        </a>
      </div>

      <div class="card">
        <div class="card-body">
          <form method="post" action="{{ url_for('update_user', user_id=user.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
              <label for="name" class="form-label">Nazwa</label>
              <input type="text" id="name" name="name" class="form-control"
                     value="{{ user.name }}" maxlength="100" required>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg me-1"></i> Zapisz zmiany
              </button>
              <a href="{{ url_for('user_details', user_id=user.id) }}" class="btn btn-outline-secondary">Anuluj</a>
            </div>
          </form>
        </div>
      </div>
{% endblock %}
