    body {
      background: #f6f8fb;

    .admin-sidebar {
      width: 260px;
      min-height: 100vh;
    }

    .admin-sidebar .nav-link {
      color: rgba(255, 255, 255, .75);
      border-radius: .5rem;
      padding: .65rem .9rem;
    }

    .admin-sidebar .nav-link:hover,
    .admin-sidebar .nav-link.active {
      background: rgba(255, 255, 255, .12);
      color: #fff;
    }

    .card {
      border: 0;
      border-radius: 1rem;
      box-shadow: 0 .25rem 1rem rgba(15, 23, 42, .06);
    }

    .table thead th {
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: #64748b;
      border-bottom: 1px solid #e2e8f0;
    }

    .table td {
      vertical-align: middle;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
    }
  </style>
</head>
