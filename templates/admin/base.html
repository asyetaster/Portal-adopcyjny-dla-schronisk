<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel administracyjny — Lista</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    body {
      background: #f6f8fb;
    }

    .admin-sidebar {
      width: 260px;
      min-height: 100vh;
    }

    .admin-sidebar .nav-link {
      color: rgba(255, 255, 255, .75);
      border-radius: .5rem;
      padding: .65rem .9rem;
    }

    .admin-sidebar .nav-link:hover,
    .admin-sidebar .nav-link.active {
      background: rgba(255, 255, 255, .12);
      color: #fff;
    }

    .card {
      border: 0;
      border-radius: 1rem;
      box-shadow: 0 .25rem 1rem rgba(15, 23, 42, .06);
    }

    .table thead th {
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: #64748b;
      border-bottom: 1px solid #e2e8f0;
    }

    .table td {
      vertical-align: middle;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
    }
  </style>
</head>
<body>

<div class="d-flex">

  <!-- Sidebar -->
  <aside class="admin-sidebar bg-dark text-white p-3 d-none d-lg-block">
    <a href="#" class="d-flex align-items-center text-white text-decoration-none mb-4">
      <i class="bi bi-box-seam fs-4 me-2"></i>
      <span class="fs-5 fw-semibold">Admin</span>
    </a>

    <ul class="nav flex-column gap-1">
      <li class="nav-item">
        <a class="nav-link" href="#">
          <i class="bi bi-speedometer2 me-2"></i> Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link active" href="#">
          <i class="bi bi-people me-2"></i> Użytkownicy
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">
          <i class="bi bi-bag me-2"></i> Zamówienia
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">
          <i class="bi bi-gear me-2"></i> Ustawienia
        </a>
      </li>
    </ul>
  </aside>

  <!-- Main -->
  <main class="flex-grow-1 p-3 p-lg-4">
  {% for flashed in get_flashed_messages() %}
    <p class="message">{{ flashed }}</p>
  {% endfor %}
  {% block content %}{% endblock %}

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
