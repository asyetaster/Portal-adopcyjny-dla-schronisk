<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Panel administracyjny{% endblock %}</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Open+Sans:wght@400;600;700;800&display=swap">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='admin/admin.css') }}" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>

<div class="d-flex">

  <!-- Sidebar -->
  <aside class="admin-sidebar p-3 d-none d-lg-block">
    <a href="{{ url_for('user_list') }}" class="brand d-flex align-items-center text-decoration-none mb-4">
      <i class="bi bi-box-seam fs-4 me-2"></i>
      <span class="fs-5 fw-semibold">Admin</span>
    </a>

    <ul class="nav flex-column gap-1">
      <li class="nav-item">
        <a class="nav-link" href="{{ url_for('home') }}">
          <i class="bi bi-house me-2"></i> Strona główna
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {{ 'active' if request.endpoint and request.endpoint.startswith('user_') else '' }}"
           href="{{ url_for('user_list') }}">
          <i class="bi bi-people me-2"></i> Użytkownicy
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {{ 'active' if request.endpoint in ('admin_shelter_list', 'admin_shelter_details') else '' }}"
           href="{{ url_for('admin_shelter_list') }}">
          <i class="bi bi-building me-2"></i> Placówki
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {{ 'active' if request.endpoint == 'admin_shelter_pending' else '' }}"
           href="{{ url_for('admin_shelter_pending') }}">
          <i class="bi bi-hourglass-split me-2"></i> Do zatwierdzenia
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {{ 'active' if request.endpoint and request.endpoint.startswith('admin_animal_') else '' }}"
           href="{{ url_for('admin_animal_list') }}">
          <i class="bi bi-balloon-heart me-2"></i> Karty zwierząt
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {{ 'active' if request.endpoint and request.endpoint.startswith('admin_mail_') else '' }}"
           href="{{ url_for('admin_mail_list') }}">
          <i class="bi bi-envelope me-2"></i> Maile
        </a>
      </li>
    </ul>

    <div class="mt-3 pt-3 border-top">
      {% if g.user %}
      <p class="small text-secondary mb-2">
        Zalogowany: <strong>{{ g.user['first_name'] }}</strong>
      </p>
      {% endif %}
      <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="btn btn-outline-secondary w-100">
          <i class="bi bi-box-arrow-right me-1"></i> Wyloguj
        </button>
      </form>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-grow-1 p-3 p-lg-4">
  {% for flashed in get_flashed_messages() %}
    <p class="message">{{ flashed }}</p>
  {% endfor %}
  {% block content %}{% endblock %}

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
