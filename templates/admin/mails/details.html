{% extends "admin/base.html" %}
{% block title %}{{ mail.subject }}{% endblock %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
  <h1 class="h4 mb-0">{{ mail.subject }}</h1>
  <div class="d-flex gap-2">
    <a href="{{ url_for('admin_mail_download', name=mail.name) }}" class="btn btn-primary">
      <i class="bi bi-download me-1"></i> Pobierz .eml
    </a>
    <a href="{{ url_for('admin_mail_list') }}" class="btn btn-outline-secondary">
      <i class="bi bi-arrow-left me-1"></i> Wróć do listy
    </a>
  </div>
</div>

<div class="card"><div class="card-body">
  <dl class="row mb-3">
    <dt class="col-sm-2 text-secondary">Od</dt><dd class="col-sm-10">{{ mail.from }}</dd>
    <dt class="col-sm-2 text-secondary">Do</dt><dd class="col-sm-10">{{ mail.to }}</dd>
    <dt class="col-sm-2 text-secondary">Data (UTC)</dt><dd class="col-sm-10">{{ mail.date }}</dd>
    <dt class="col-sm-2 text-secondary">Plik</dt><dd class="col-sm-10"><code>{{ mail.name }}</code></dd>
  </dl>
  <pre class="border rounded p-3 mb-0" style="white-space: pre-wrap">{{ mail.body }}</pre>
</div></div>
{% endblock %}
